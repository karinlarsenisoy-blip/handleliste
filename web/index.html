<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Handleliste - kvitteringsscanner og delte handlelister">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="handleliste_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>handleliste_app</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #app-boot-loading, #app-boot-fallback {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: sans-serif;
      background: #ffffff;
      text-align: center;
      padding: 24px;
    }
    #app-boot-fallback { display: none; }
    #app-boot-loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #cfe3e4;
      border-top-color: #1B5E63;
      border-radius: 50%;
      animation: app-boot-spin 0.8s linear infinite;
    }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    #app-boot-fallback button {
      background: #1B5E63;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app-boot-loading">
    <div class="spinner"></div>
    <p>Laster Handleliste …</p>
  </div>

  <!--
    A first-time load normally finishes in a couple of seconds. If it's
    still stuck here after 10s, something in the browser's own startup
    plumbing (most often a stuck IndexedDB connection held by another tab
    with this site open) is blocking it — Flutter's Dart code never even
    gets to run in that case, so this fallback is plain JS in the page
    itself, independent of whether the app's own JS/Dart bundle ever loads.
  -->
  <div id="app-boot-fallback">
    <p>Dette tar uvanlig lang tid å laste.</p>
    <p>Har du Handleliste åpen i en annen fane eller et annet vindu? Prøv å lukke den, og trykk «Prøv igjen» under.</p>
    <button onclick="location.reload()">Prøv igjen</button>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('app-boot-loading');
      var fallback = document.getElementById('app-boot-fallback');
      var loaded = false;
      window.addEventListener('flutter-first-frame', function () {
        loaded = true;
        if (loading) loading.style.display = 'none';
        if (fallback) fallback.style.display = 'none';
      });
      setTimeout(function () {
        if (loaded) return;
        if (loading) loading.style.display = 'none';
        if (fallback) fallback.style.display = 'flex';
      }, 10000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
